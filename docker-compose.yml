services:

  # ======================
  # ZOOKEEPER
  # ======================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  # ======================
  # KAFKA
  # ======================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
  # ======================
  # REDIS
  # ======================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # ======================
  # MINIO
  # ======================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # ======================
  # MLFLOW
  # ======================
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow/mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0

  # ======================
  # POSTGRESQL (for Airflow)
  # ======================
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ======================
  # AIRFLOW
  # ======================
  airflow:
    image: apache/airflow:2.10.0-python3.11
    container_name: airflow
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW_HOME: /opt/airflow
      _PIP_ADDITIONAL_REQUIREMENTS: "networkx minio feast"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./feast_repo:/opt/airflow/feast_repo    # ← manque peut-être
      - ./datasets:/opt/airflow/datasets 
    command: >
      bash -c "
      airflow db init &&
      airflow users create
        --username admin
        --password admin
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@local 2>/dev/null || true &&
      airflow webserver --port 8080 &
      airflow scheduler
  
      "

  
  # ======================
  # PROMETHEUS
  # ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ======================
  # GRAFANA
  # ======================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus


  # ======================
  # FASTAPI - FRAUD DETECTION
  # ======================
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./feast_repo:/app/feast_repo
      - ./feast_repo/feature_store.docker.yaml:/app/feast_repo/feature_store.yaml:ro
    depends_on:
      - redis
    restart: unless-stopped

  # ======================
  # STREAMLIT - DASHBOARD SOC
  # ======================

  streamlit:
    build:
      context: .
      dockerfile: streamlit/dockerfile
    container_name: streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./feast_repo:/app/feast_repo
      - ./feast_repo/feature_store.docker.yaml:/app/feast_repo/feature_store.yaml:ro
    depends_on:
      - redis
      - minio
      - fraud-api
    restart: unless-stopped
# ======================
# VOLUMES
# ======================
volumes:
  minio-data:
  postgres-data: